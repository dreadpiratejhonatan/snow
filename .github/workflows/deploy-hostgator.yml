# Sobe release/hostgator-snow/ na HostGator via FTP (sem apagar ranking/tickets).
name: Deploy HostGator

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: FTP upload (preserve live data/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTGATOR_FTP_HOST }}
          username: ${{ secrets.HOSTGATOR_FTP_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          local-dir: ./release/hostgator-snow/
          # Conta snowdeploy: raiz FTP já é a pasta do jogo → use /
          server-dir: ${{ secrets.HOSTGATOR_FTP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            data/leaderboard.json
            data/tickets.json
            data/tickets-admin.key
            data/tickets-rate.json
            data/rooms/**
            data/rooms/**/*
