# Sobe release/hostgator-snow/ na HostGator via FTP (sem apagar ranking/tickets).
name: Deploy HostGator

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # FTP-Deploy-Action ainda declara Node 20; runners forçam 24 —
      # pin explícito evita surpresa de runtime no login FTP.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Plain FTP first (histórico HostGator). Se 530/TLS, tenta FTPS.
      - name: FTP upload (plain)
        id: ftp_plain
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTGATOR_FTP_HOST }}
          username: ${{ secrets.HOSTGATOR_FTP_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          local-dir: ./release/hostgator-snow/
          server-dir: ${{ secrets.HOSTGATOR_FTP_DIR }}
          protocol: ftp
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            data/leaderboard.json
            data/tickets.json
            data/tickets-admin.key
            data/tickets-rate.json
            data/rooms/**
            data/rooms/**/*

      - name: FTP upload (FTPS fallback)
        if: steps.ftp_plain.outcome != 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTGATOR_FTP_HOST }}
          username: ${{ secrets.HOSTGATOR_FTP_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          local-dir: ./release/hostgator-snow/
          server-dir: ${{ secrets.HOSTGATOR_FTP_DIR }}
          protocol: ftps
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            data/leaderboard.json
            data/tickets.json
            data/tickets-admin.key
            data/tickets-rate.json
            data/rooms/**
            data/rooms/**/*

