# Publica Neve Selvagem no GitHub Pages a partir de dist/
name: Deploy GitHub Pages

on:
  push:
    # github-pages env só permite main/master — develop sempre era rejeitado
    # ("Branch develop is not allowed…"). HostGator cobre o site do celular.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Base absoluta da API PHP (ex.: https://SEU-DOMINIO/snow/api) — fica só no secret
          SNOW_API_BASE: ${{ secrets.SNOW_API_BASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
