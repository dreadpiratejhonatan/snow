name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Coop relay smoke (pulado se SIGNAL_URL não for secret)
        run: npm run test:coop-relay
        env:
          SIGNAL_URL: ${{ secrets.SIGNAL_URL }}
        continue-on-error: true
      - name: Unit smoke
        run: npm run test:smoke
        continue-on-error: true
