# Auto-merge Cursor Cloud Agent PRs into develop, then kick production deploys.
# Phone / cloud-agent branches: cursor/**
#
# Merges with GITHUB_TOKEN do not create push-triggered workflow runs, but
# workflow_dispatch is an allowed exception — so we dispatch the existing
# Deploy HostGator + Deploy GitHub Pages workflows after merge.
name: Auto-merge Cursor PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, master, main]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: auto-merge-cursor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (needed for gh)
        uses: actions/checkout@v4

      - name: Retarget to develop, wait for CI, squash-merge, dispatch deploys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$BASE" != "develop" ]; then
            echo "Retargeting PR #$PR from $BASE → develop"
            gh pr edit "$PR" --base develop
          fi

          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Marking PR #$PR ready for review"
            gh pr ready "$PR"
          fi

          echo "Waiting for CI on $HEAD_SHA (ignoring Auto-merge Cursor PRs)…"
          sleep 10
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --paginate)
            echo "$json" | jq -r '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "-")"' \
              | grep -viE '^(merge)\t' \
              | tee /tmp/checks.tsv || true

            if awk -F'\t' '
              BEGIN { pending=0; failed=0; seen=0 }
              $1 == "merge" { next }
              {
                seen=1
                if ($2 != "completed") pending=1
                else if ($3 == "failure" || $3 == "cancelled" || $3 == "timed_out") failed=1
              }
              END {
                if (failed) exit 2
                if (pending) exit 3
                if (!seen) exit 4
                exit 0
              }
            ' /tmp/checks.tsv; then
              echo "CI green"
              break
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "A CI check failed — not merging"
                exit 1
              fi
              if [ "$rc" -eq 3 ]; then
                echo "CI still running…"
                sleep 15
                continue
              fi
              if [ "$SECONDS" -lt 180 ]; then
                echo "CI not registered yet — waiting…"
                sleep 15
                continue
              fi
              echo "No external checks after wait — proceeding"
              break
            fi
          done

          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "Timed out waiting for CI"
            exit 1
          fi

          echo "Squash-merging PR #$PR into develop"
          gh pr merge "$PR" --squash --delete-branch --subject "Auto-merge cursor PR #${PR}"

          # workflow_dispatch is allowed to start new runs even from GITHUB_TOKEN.
          echo "Dispatching production deploys on develop…"
          gh workflow run "Deploy HostGator" --ref develop
          gh workflow run "Deploy GitHub Pages" --ref develop
          echo "Done — watch Actions for HostGator + Pages."
